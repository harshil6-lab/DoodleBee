<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 70" width="900" height="70" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="hz" width="28" height="14" patternUnits="userSpaceOnUse">
      <rect width="28" height="14" fill="#ffd500"/>
      <polygon points="14,0 28,0 14,14 0,14" fill="#1a1a1a"/>
    </pattern>
    <clipPath id="band"><rect x="0" y="14" width="900" height="42"/></clipPath>
  </defs>

  <rect width="900" height="70" rx="8" fill="#1a1a1a"/>
  <rect x="0" y="0" width="900" height="14" fill="url(#hz)"/>
  <rect x="0" y="56" width="900" height="14" fill="url(#hz)"/>

  <g clip-path="url(#band)" font-family="'Courier New', Courier, monospace" font-weight="bold" font-size="22" fill="#ffd500">
    <g>
      <text x="0" y="43" textLength="900" lengthAdjust="spacing">/// UNDER CONSTRUCTION /// BEES AT WORK /// HARD HATS REQUIRED ///</text>
      <text x="900" y="43" textLength="900" lengthAdjust="spacing">/// UNDER CONSTRUCTION /// BEES AT WORK /// HARD HATS REQUIRED ///</text>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-900 0" dur="14s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
