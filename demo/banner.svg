<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 340" width="900" height="340" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1035"/>
      <stop offset="1" stop-color="#34205c"/>
    </linearGradient>
    <pattern id="hex" width="60" height="34.64" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#ffd500" stroke-opacity="0.13" stroke-width="1.5">
        <polygon points="40,17.32 30,34.64 10,34.64 0,17.32 10,0 30,0"/>
        <polygon points="70,0 60,17.32 40,17.32 30,0 40,-17.32 60,-17.32"/>
        <polygon points="70,34.64 60,51.96 40,51.96 30,34.64 40,17.32 60,17.32"/>
        <polygon points="10,0 0,17.32 -20,17.32 -30,0 -20,-17.32 0,-17.32"/>
        <polygon points="10,34.64 0,51.96 -20,51.96 -30,34.64 -20,17.32 0,17.32"/>
      </g>
    </pattern>
    <clipPath id="bc"><ellipse cx="0" cy="0" rx="24" ry="16"/></clipPath>

    <g id="bee">
      <ellipse cx="-6" cy="-14" rx="13" ry="9" fill="#bfe9ff" fill-opacity="0.9" stroke="#1a1a1a" stroke-width="2" transform="rotate(-20 -6 -14)">
        <animateTransform attributeName="transform" type="rotate" values="-20 -6 -14;-55 -6 -14;-20 -6 -14" dur="0.22s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="7" cy="-14" rx="12" ry="8" fill="#bfe9ff" fill-opacity="0.9" stroke="#1a1a1a" stroke-width="2" transform="rotate(-10 7 -14)">
        <animateTransform attributeName="transform" type="rotate" values="-10 7 -14;-45 7 -14;-10 7 -14" dur="0.22s" repeatCount="indefinite"/>
      </ellipse>
      <polygon points="-22,-3 -34,0 -22,3" fill="#1a1a1a"/>
      <ellipse cx="0" cy="0" rx="24" ry="16" fill="#ffd500"/>
      <g clip-path="url(#bc)" fill="#1a1a1a">
        <rect x="-12" y="-20" width="8" height="40"/>
        <rect x="3" y="-20" width="8" height="40"/>
      </g>
      <ellipse cx="0" cy="0" rx="24" ry="16" fill="none" stroke="#1a1a1a" stroke-width="3"/>
      <circle cx="26" cy="-3" r="10" fill="#ffd500" stroke="#1a1a1a" stroke-width="3"/>
      <circle cx="29" cy="-5" r="3" fill="#1a1a1a"/>
      <circle cx="30" cy="-6" r="1" fill="#ffffff"/>
      <path d="M26 2 Q30 6 34 1" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
      <path d="M27 -12 Q30 -22 38 -22" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
      <g transform="rotate(35 24 8)">
        <rect x="22" y="5" width="22" height="7" fill="#ff6b6b" stroke="#1a1a1a" stroke-width="1.5"/>
        <polygon points="44,5 53,8.5 44,12" fill="#f5deb3" stroke="#1a1a1a" stroke-width="1.5"/>
      </g>
    </g>
  </defs>

  <rect width="900" height="340" rx="18" fill="url(#bg)"/>
  <rect width="900" height="340" rx="18" fill="url(#hex)"/>
  <rect x="3" y="3" width="894" height="334" rx="16" fill="none" stroke="#ffd500" stroke-width="3"/>

  <g font-family="'Courier New', Courier, monospace" font-weight="bold" font-size="15">
    <text x="26" y="34" fill="#ffffff">1UP <tspan fill="#ffd500">000500</tspan></text>
    <text x="450" y="34" fill="#ff6b6b" text-anchor="middle">8 PLAYERS ONLINE</text>
    <text x="874" y="34" fill="#ffffff" text-anchor="end">HI-SCORE <tspan fill="#ffd500">999999</tspan></text>
  </g>

  <g font-family="Impact, 'Arial Black', 'Courier New', sans-serif" text-anchor="middle">
    <text x="456" y="162" font-size="104" textLength="640" lengthAdjust="spacingAndGlyphs" fill="#ff6b6b" stroke="#1a1a1a" stroke-width="10" stroke-linejoin="round">DOODLEBEE</text>
    <text x="450" y="156" font-size="104" textLength="640" lengthAdjust="spacingAndGlyphs" fill="#ffd500" stroke="#1a1a1a" stroke-width="10" stroke-linejoin="round" paint-order="stroke">
      DOODLEBEE
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="1.6s" repeatCount="indefinite"/>
    </text>
  </g>

  <text x="450" y="200" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-weight="bold" font-size="19" fill="#ffffff" letter-spacing="2">DRAW IT. GUESS IT. BEE THE QUEEN.</text>

  <path id="scribble" d="M70 266 C150 236 190 296 280 262 S420 236 500 266 S650 296 735 259 S810 242 835 266" fill="none" stroke="#ff6b6b" stroke-width="5" stroke-linecap="round" pathLength="1000" stroke-dasharray="1000" stroke-dashoffset="1000">
    <animate attributeName="stroke-dashoffset" values="1000;0;0" keyTimes="0;0.8;1" dur="6s" repeatCount="indefinite"/>
  </path>

  <g>
    <animateMotion dur="6s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.8;1">
      <mpath xlink:href="#scribble"/>
    </animateMotion>
    <use xlink:href="#bee" transform="translate(-47 -24)"/>
  </g>

  <text x="450" y="322" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-weight="bold" font-size="20" fill="#ffd500" letter-spacing="4">
    &#9654; PRESS START &#9664;
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
  </text>
</svg>
